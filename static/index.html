<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sharp Pages" />
  <meta name="theme-color" content="#0f0f13" />
  <title>Sharp Pages — AI Selling Assistant</title>
  <style>
    /* ------------------------------------------------------------------ */
    /* Reset & base                                                         */
    /* ------------------------------------------------------------------ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0f0f13;
      --surface:     #1a1a24;
      --surface2:    #22222f;
      --border:      #2e2e42;
      --accent:      #7c3aed;
      --accent-lite: #9d5cf7;
      --accent-dim:  rgba(124,58,237,0.18);
      --text:        #f0f0f8;
      --text-dim:    #8888aa;
      --text-muted:  #5a5a7a;
      --success:     #22c55e;
      --user-bg:     #7c3aed;
      --bot-bg:      #1a1a24;
      --tool-bg:     #12121a;
      --radius:      16px;
      --radius-sm:   10px;
      --shadow:      0 4px 24px rgba(0,0,0,0.5);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* ------------------------------------------------------------------ */
    /* Layout scaffold                                                      */
    /* ------------------------------------------------------------------ */
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      height: 100dvh;          /* dynamic viewport height on iOS */
    }

    /* ------------------------------------------------------------------ */
    /* Header                                                               */
    /* ------------------------------------------------------------------ */
    #header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      padding-top: calc(14px + env(safe-area-inset-top));
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }

    .logo-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .logo-text h1 {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--text);
    }

    .logo-text p {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 1px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      margin-left: auto;
      box-shadow: 0 0 6px var(--success);
    }

    /* ------------------------------------------------------------------ */
    /* Messages area                                                        */
    /* ------------------------------------------------------------------ */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      /* Smooth scrolling on iOS */
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }

    /* Empty state */
    #empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      text-align: center;
      padding: 32px 16px 0;
      gap: 8px;
    }

    #empty-state .hero-icon {
      font-size: 52px;
      margin-bottom: 8px;
    }

    #empty-state h2 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
    }

    #empty-state p {
      font-size: 14px;
      color: var(--text-dim);
      max-width: 280px;
    }

    /* Suggestion chips */
    #chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 20px;
      padding: 0 4px;
    }

    .chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 13px;
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }

    .chip:hover {
      background: var(--accent-dim);
      border-color: var(--accent);
    }

    .chip:active {
      transform: scale(0.96);
    }

    /* ------------------------------------------------------------------ */
    /* Message bubbles                                                      */
    /* ------------------------------------------------------------------ */
    .message-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      animation: fadeSlide 0.2s ease-out;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message-row.user {
      flex-direction: row-reverse;
    }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .avatar.bot  { background: linear-gradient(135deg, var(--accent), #a855f7); }
    .avatar.user { background: var(--surface2); border: 1px solid var(--border); }

    .bubble {
      max-width: min(75%, 520px);
      padding: 11px 15px;
      border-radius: var(--radius);
      font-size: 15px;
      line-height: 1.55;
      word-break: break-word;
    }

    .message-row.user  .bubble {
      background: var(--user-bg);
      color: #fff;
      border-bottom-right-radius: 5px;
    }

    .message-row.bot .bubble {
      background: var(--bot-bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-bottom-left-radius: 5px;
    }

    /* ------------------------------------------------------------------ */
    /* Markdown rendering inside bot bubbles                               */
    /* ------------------------------------------------------------------ */
    .bubble h1, .bubble h2, .bubble h3 {
      font-weight: 700;
      margin: 12px 0 6px;
      color: var(--text);
    }
    .bubble h1 { font-size: 18px; }
    .bubble h2 { font-size: 16px; }
    .bubble h3 { font-size: 15px; color: var(--accent-lite); }

    .bubble p { margin: 6px 0; }

    .bubble ul, .bubble ol {
      margin: 6px 0 6px 18px;
    }

    .bubble li { margin: 3px 0; }

    .bubble code {
      background: rgba(124,58,237,0.15);
      color: var(--accent-lite);
      padding: 2px 6px;
      border-radius: 5px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 13px;
    }

    .bubble pre {
      background: var(--tool-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px;
      overflow-x: auto;
      margin: 8px 0;
    }

    .bubble pre code {
      background: none;
      padding: 0;
      font-size: 13px;
      color: #cdd6f4;
    }

    .bubble strong { color: #fff; font-weight: 700; }

    .bubble em { color: var(--text-dim); font-style: italic; }

    .bubble a {
      color: var(--accent-lite);
      text-decoration: underline;
    }

    .bubble hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 10px 0;
    }

    .bubble blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 12px;
      color: var(--text-dim);
      margin: 8px 0;
    }

    /* ------------------------------------------------------------------ */
    /* Tool cards                                                           */
    /* ------------------------------------------------------------------ */
    .tool-card {
      margin: 8px 0;
      background: var(--tool-bg);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: var(--radius-sm);
      overflow: hidden;
      font-size: 13px;
    }

    .tool-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .tool-header:hover { background: rgba(124,58,237,0.1); }

    .tool-icon { font-size: 14px; }

    .tool-name {
      font-weight: 600;
      color: var(--accent-lite);
      flex: 1;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .tool-toggle {
      color: var(--text-muted);
      font-size: 11px;
      transition: transform 0.2s;
    }

    .tool-card.open .tool-toggle { transform: rotate(180deg); }

    .tool-body {
      display: none;
      padding: 0 12px 10px;
    }

    .tool-card.open .tool-body { display: block; }

    .tool-result-content {
      background: var(--surface);
      border-radius: 6px;
      padding: 10px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 11.5px;
      color: #cdd6f4;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 260px;
      overflow-y: auto;
      border: 1px solid var(--border);
    }

    .tool-status {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .tool-status.running { color: var(--accent-lite); }
    .tool-status.done    { color: var(--success); }

    /* ------------------------------------------------------------------ */
    /* Loading indicator (pulsing dots)                                    */
    /* ------------------------------------------------------------------ */
    .loading-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .dots {
      display: flex;
      gap: 5px;
      padding: 14px 16px;
      background: var(--bot-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      border-bottom-left-radius: 5px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.2s infinite ease-in-out;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 60%, 100% { opacity: 0.3; transform: scale(0.8); }
      30%            { opacity: 1;   transform: scale(1.1); }
    }

    /* ------------------------------------------------------------------ */
    /* Input bar                                                            */
    /* ------------------------------------------------------------------ */
    #input-bar {
      flex-shrink: 0;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 12px 14px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
      background: var(--surface);
      border-top: 1px solid var(--border);
    }

    #input-wrap {
      flex: 1;
      display: flex;
      align-items: flex-end;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 6px 14px;
      transition: border-color 0.15s;
    }

    #input-wrap:focus-within { border-color: var(--accent); }

    #user-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 15px;
      resize: none;
      max-height: 120px;
      line-height: 1.5;
      font-family: inherit;
      padding: 3px 0;
    }

    #user-input::placeholder { color: var(--text-muted); }

    #send-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    #send-btn:hover  { background: var(--accent-lite); }
    #send-btn:active { transform: scale(0.92); }
    #send-btn:disabled { background: var(--surface2); cursor: default; }

    /* ------------------------------------------------------------------ */
    /* Error notice                                                         */
    /* ------------------------------------------------------------------ */
    .error-bubble {
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.4);
      color: #f87171;
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 14px;
      margin: 4px 0;
    }

    /* ------------------------------------------------------------------ */
    /* Scrollbar                                                            */
    /* ------------------------------------------------------------------ */
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  </style>
</head>
<body>
<div id="app">

  <!-- Header -->
  <header id="header">
    <div class="logo-icon">&#128204;</div>
    <div class="logo-text">
      <h1>Sharp Pages</h1>
      <p>Your AI Selling Assistant</p>
    </div>
    <div class="status-dot" id="status-dot" title="Online"></div>
  </header>

  <!-- Messages -->
  <main id="messages">
    <div id="empty-state">
      <div class="hero-icon">&#128722;</div>
      <h2>Ready to sell smarter?</h2>
      <p>Ask me anything about digital products, SEO, pricing, Pinterest, or your Gumroad store.</p>
      <div id="chips">
        <button class="chip" onclick="sendChip(this)">Write a product description</button>
        <button class="chip" onclick="sendChip(this)">Find keywords for my niche</button>
        <button class="chip" onclick="sendChip(this)">Calculate my profit margins</button>
        <button class="chip" onclick="sendChip(this)">Create Pinterest pins</button>
        <button class="chip" onclick="sendChip(this)">Analyze my sales data</button>
        <button class="chip" onclick="sendChip(this)">Plan a product launch</button>
      </div>
    </div>
  </main>

  <!-- Input bar -->
  <div id="input-bar">
    <div id="input-wrap">
      <textarea
        id="user-input"
        placeholder="Ask about your digital products..."
        rows="1"
        autocomplete="off"
        autocorrect="on"
        spellcheck="true"
      ></textarea>
    </div>
    <button id="send-btn" onclick="handleSend()" aria-label="Send">
      &#10148;
    </button>
  </div>

</div>

<script>
/* ========================================================================
   State
   ======================================================================== */
let messages = [];        // full conversation history sent to /chat
let isStreaming = false;  // prevent overlapping requests

/* ========================================================================
   Markdown renderer
   A lightweight inline parser — no deps, no framework.
   ======================================================================== */
function renderMarkdown(text) {
  const lines = text.split('\n');
  let html = '';
  let inCode = false;
  let inList = false;
  let listType = '';

  function closeList() {
    if (inList) {
      html += `</${listType}>`;
      inList = false;
      listType = '';
    }
  }

  function inlineFormat(s) {
    // Escape HTML first
    s = s
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
    // Code spans (do first to avoid double-processing)
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    // Bold+italic
    s = s.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
    // Bold
    s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/__(.+?)__/g, '<strong>$1</strong>');
    // Italic
    s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
    s = s.replace(/_([^_]+)_/g, '<em>$1</em>');
    // Links
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return s;
  }

  for (let i = 0; i < lines.length; i++) {
    const raw = lines[i];

    // Fenced code block
    if (raw.startsWith('```')) {
      if (!inCode) {
        closeList();
        const lang = raw.slice(3).trim();
        html += `<pre><code class="lang-${lang}">`;
        inCode = true;
      } else {
        html += '</code></pre>';
        inCode = false;
      }
      continue;
    }
    if (inCode) {
      html += raw
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;') + '\n';
      continue;
    }

    // Horizontal rule
    if (/^(-{3,}|\*{3,}|_{3,})$/.test(raw.trim())) {
      closeList();
      html += '<hr>';
      continue;
    }

    // Headers
    const hMatch = raw.match(/^(#{1,3})\s+(.+)/);
    if (hMatch) {
      closeList();
      const level = hMatch[1].length;
      html += `<h${level}>${inlineFormat(hMatch[2])}</h${level}>`;
      continue;
    }

    // Blockquote
    if (raw.startsWith('> ')) {
      closeList();
      html += `<blockquote>${inlineFormat(raw.slice(2))}</blockquote>`;
      continue;
    }

    // Unordered list
    const ulMatch = raw.match(/^(\s*)[-*+]\s+(.+)/);
    if (ulMatch) {
      if (!inList || listType !== 'ul') {
        closeList();
        html += '<ul>';
        inList = true;
        listType = 'ul';
      }
      html += `<li>${inlineFormat(ulMatch[2])}</li>`;
      continue;
    }

    // Ordered list
    const olMatch = raw.match(/^(\s*)\d+\.\s+(.+)/);
    if (olMatch) {
      if (!inList || listType !== 'ol') {
        closeList();
        html += '<ol>';
        inList = true;
        listType = 'ol';
      }
      html += `<li>${inlineFormat(olMatch[2])}</li>`;
      continue;
    }

    // Empty line — close list or add paragraph break
    if (raw.trim() === '') {
      closeList();
      html += '<p></p>';
      continue;
    }

    // Regular paragraph line
    closeList();
    html += `<p>${inlineFormat(raw)}</p>`;
  }

  closeList();
  if (inCode) html += '</code></pre>';  // close unclosed code block

  return html;
}

/* ========================================================================
   UI helpers
   ======================================================================== */
const messagesEl = document.getElementById('messages');
const emptyState = document.getElementById('empty-state');
const sendBtn    = document.getElementById('send-btn');
const inputEl    = document.getElementById('user-input');

function hideEmptyState() {
  if (emptyState && emptyState.parentNode) {
    emptyState.remove();
  }
}

function scrollToBottom(smooth = true) {
  messagesEl.scrollTo({
    top: messagesEl.scrollHeight,
    behavior: smooth ? 'smooth' : 'instant',
  });
}

function addUserBubble(text) {
  hideEmptyState();
  const row = document.createElement('div');
  row.className = 'message-row user';
  row.innerHTML = `
    <div class="avatar user">&#128100;</div>
    <div class="bubble">${escapeHtml(text)}</div>
  `;
  messagesEl.appendChild(row);
  scrollToBottom();
  return row;
}

function escapeHtml(s) {
  return s
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function addBotBubbleRow() {
  const row = document.createElement('div');
  row.className = 'message-row bot';
  row.innerHTML = `
    <div class="avatar bot">&#127885;</div>
    <div class="bubble" data-raw=""></div>
  `;
  messagesEl.appendChild(row);
  return row;
}

function showLoading() {
  const row = document.createElement('div');
  row.className = 'loading-row';
  row.id = 'loading-indicator';
  row.innerHTML = `
    <div class="avatar bot">&#127885;</div>
    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  `;
  messagesEl.appendChild(row);
  scrollToBottom();
}

function hideLoading() {
  const el = document.getElementById('loading-indicator');
  if (el) el.remove();
}

function setInputEnabled(enabled) {
  inputEl.disabled = !enabled;
  sendBtn.disabled = !enabled;
  isStreaming = !enabled;
}

/* ========================================================================
   Tool card
   ======================================================================== */
function createToolCard(name, toolUseId) {
  const card = document.createElement('div');
  card.className = 'tool-card';
  card.dataset.toolUseId = toolUseId;
  card.innerHTML = `
    <div class="tool-header" onclick="toggleToolCard(this.parentElement)">
      <span class="tool-icon">&#9881;&#65039;</span>
      <span class="tool-name">${escapeHtml(formatToolName(name))}</span>
      <span class="tool-status running">Running&#8230;</span>
      <span class="tool-toggle">&#9660;</span>
    </div>
    <div class="tool-body">
      <div class="tool-result-content">Waiting for result&#8230;</div>
    </div>
  `;
  return card;
}

function formatToolName(name) {
  return name.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

function toggleToolCard(card) {
  card.classList.toggle('open');
}

function updateToolCard(card, result) {
  const statusEl = card.querySelector('.tool-status');
  statusEl.className = 'tool-status done';
  statusEl.textContent = 'Done';

  const contentEl = card.querySelector('.tool-result-content');
  let resultText;
  if (typeof result === 'string') {
    resultText = result;
  } else {
    try {
      resultText = JSON.stringify(result, null, 2);
    } catch {
      resultText = String(result);
    }
  }
  contentEl.textContent = resultText;
}

/* ========================================================================
   Core: sendMessage
   ======================================================================== */
async function sendMessage(text) {
  if (!text.trim() || isStreaming) return;

  setInputEnabled(false);

  // Add to conversation history
  messages.push({ role: 'user', content: text });

  // Render user bubble
  addUserBubble(text);

  // Show loading dots
  showLoading();

  // Create bot bubble row (will be populated as stream arrives)
  let botRow = null;
  let bubbleEl = null;
  let rawText = '';          // accumulates markdown text
  let currentToolCard = null;

  try {
    const resp = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages }),
    });

    if (!resp.ok) {
      throw new Error(`HTTP ${resp.status}: ${resp.statusText}`);
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });

      // Process complete SSE events (delimited by \n\n)
      const parts = buffer.split('\n\n');
      buffer = parts.pop(); // keep incomplete tail

      for (const part of parts) {
        const line = part.trim();
        if (!line.startsWith('data:')) continue;
        const jsonStr = line.slice(5).trim();
        if (!jsonStr) continue;

        let event;
        try {
          event = JSON.parse(jsonStr);
        } catch {
          continue;
        }

        switch (event.type) {

          case 'text': {
            // First text chunk — remove loading, create bot bubble
            if (!botRow) {
              hideLoading();
              botRow = addBotBubbleRow();
              bubbleEl = botRow.querySelector('.bubble');
            }
            rawText += event.content;
            bubbleEl.innerHTML = renderMarkdown(rawText);
            scrollToBottom(false);
            break;
          }

          case 'tool_start': {
            // Ensure bot bubble exists (tool may arrive before any text)
            if (!botRow) {
              hideLoading();
              botRow = addBotBubbleRow();
              bubbleEl = botRow.querySelector('.bubble');
            }
            // Render any accumulated text first
            if (rawText) {
              bubbleEl.innerHTML = renderMarkdown(rawText);
              rawText = '';
            }
            // Insert tool card into the bubble
            currentToolCard = createToolCard(event.name, event.name + '_' + Date.now());
            bubbleEl.appendChild(currentToolCard);
            scrollToBottom(false);
            break;
          }

          case 'tool_result': {
            if (currentToolCard) {
              updateToolCard(currentToolCard, event.result);
              currentToolCard = null;
            }
            scrollToBottom(false);
            break;
          }

          case 'done': {
            // Finalize the bubble
            if (bubbleEl && rawText) {
              bubbleEl.innerHTML = renderMarkdown(rawText);
            }
            // Record assistant message in history
            if (rawText) {
              messages.push({ role: 'assistant', content: rawText });
            }
            scrollToBottom();
            break;
          }

          case 'error': {
            hideLoading();
            if (!botRow) {
              botRow = addBotBubbleRow();
              bubbleEl = botRow.querySelector('.bubble');
            }
            bubbleEl.innerHTML = `<div class="error-bubble">&#10060; ${escapeHtml(event.message)}</div>`;
            scrollToBottom();
            break;
          }
        }
      }
    }

  } catch (err) {
    hideLoading();
    if (!botRow) {
      botRow = addBotBubbleRow();
      bubbleEl = botRow.querySelector('.bubble');
    }
    if (bubbleEl) {
      bubbleEl.innerHTML = `<div class="error-bubble">&#10060; Connection error: ${escapeHtml(err.message)}</div>`;
    }
    scrollToBottom();
  } finally {
    setInputEnabled(true);
    inputEl.focus();
  }
}

/* ========================================================================
   Event handlers
   ======================================================================== */
function handleSend() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = '';
  autoResizeInput();
  sendMessage(text);
}

function sendChip(btn) {
  const text = btn.textContent.trim();
  sendMessage(text);
}

// Auto-resize textarea
function autoResizeInput() {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
}

inputEl.addEventListener('input', autoResizeInput);

// Send on Enter (not Shift+Enter), but only on non-mobile
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && window.innerWidth > 640) {
    e.preventDefault();
    handleSend();
  }
});

// Initial focus on desktop
if (window.innerWidth > 640) {
  inputEl.focus();
}
</script>
